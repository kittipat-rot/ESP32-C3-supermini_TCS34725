<text class="mono b" x="680" y="724" font-size="12" fill="#1d2329">1</text><text x="700" y="724" font-size="13" fill="#1d2329">จ่ายไฟ VIN จากขา 3V3 เท่านั้น — ห้ามต่อ 5V</text><text x="700" y="747" font-size="13" fill="#59626b">โมดูลบางรุ่นดึง SDA/SCL ขึ้นไปเท่ากับ VIN ทำให้ ESP32-C3 เสียหายได้</text><text class="mono b" x="680" y="770" font-size="12" fill="#1d2329">2</text><text x="700" y="770" font-size="13" fill="#1d2329">ห้ามต่ออุปกรณ์ที่ GPIO 2, 8, 9 (ขาบูต) — 8 = LED สีฟ้า, 9 = ปุ่ม BOOT</text><text class="mono b" x="680" y="793" font-size="12" fill="#1d2329">3</text><text x="700" y="793" font-size="13" fill="#1d2329">ขา 3V3 ของโมดูลเป็นไฟออกจากเรกูเลเตอร์ และขา INT ไม่ได้ใช้ — ปล่อยว่าง</text><text class="mono b" x="680" y="816" font-size="12" fill="#1d2329">4</text><text x="700" y="816" font-size="13" fill="#1d2329">ชื่อขาพิมพ์อยู่ด้านหลังบอร์ด และตำแหน่งอาจต่างตามผู้ผลิต — ต่อตามตัวอักษร</text><text class="mono b" x="680" y="839" font-size="12" fill="#1d2329">5</text><text x="700" y="839" font-size="13" fill="#1d2329">โมดูลมี pull-up ของ I²C อยู่แล้ว · ใช้สายสั้นไม่เกินประมาณ 20 cm</text>
</svg>
