<title id="t">Wiring diagram: ESP32-C3 Super Mini × TCS34725</title>
<desc id="d">TCS34725 VIN to 3V3, GND to GND, SCL to GPIO4, SDA to GPIO3, LED to GPIO1; module 3V3 and INT not connected; do not use 5V or strapping pins GPIO2, 8, 9.</desc>
